<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <title>Dice Roller</title>
  </head>
  <body>
    <div id="dice">
      <div class="dice__number number-1 hidden">1</div>
      <div class="dice__number number-2 hidden">2</div>
      <div class="dice__number number-3 hidden">3</div>
      <div class="dice__number number-4 hidden">4</div>
      <div class="dice__number number-5 hidden">5</div>
      <div class="dice__number number-6 hidden">6</div>
    </div>
    <button class="btn__roll">Roll</button>
  </body>
</html>
